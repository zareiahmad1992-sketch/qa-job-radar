name: QA Job Radar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scan sources and send new jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_radar.py --once

      - name: Save seen-job state
        run: |
          if [ -n "$(git status --porcelain -- seen_jobs.json)" ]; then
            git config user.name "qa-job-radar[bot]"
            git config user.email "qa-job-radar[bot]@users.noreply.github.com"
            git add seen_jobs.json
            git commit -m "Update seen QA jobs"
            git push
          else
            echo "No state changes to commit."
          fi
